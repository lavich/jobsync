name: Deploy

on:
  push:
    branches: [feat/telegram-automation]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t jobsync:local .

      - name: Transfer image to VPS
        run: |
          docker save jobsync:local | gzip | ssh -o StrictHostKeyChecking=no \
            -i <(echo "${{ secrets.VPS_SSH_KEY }}") \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "gunzip | docker load"

      - name: Start container on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/jobsync
            docker compose up -d --no-build --force-recreate
